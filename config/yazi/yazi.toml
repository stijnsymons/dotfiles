[mgr]
show_hidden = true

# Preview Markdown with leaf (rich TUI renderer) via the piper plugin.
# Through leaf/themed, so the preview colours follow the macOS appearance.
# $w = preview width, $1 = file path. Requires: `ya pkg add yazi-rs/plugins:piper`
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- "$HOME/.config/leaf/themed" --inline "ansi:$w" "$1"'

[[plugin.prepend_previewers]]
url = "*.markdown"
run = 'piper -- "$HOME/.config/leaf/themed" --inline "ansi:$w" "$1"'

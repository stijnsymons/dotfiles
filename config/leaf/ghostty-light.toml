# leaf theme for ghostty's light mode (Catppuccin Latte), used by ./themed when
# macOS is in light mode. Same keys as ghostty.toml, colours mapped across.
base = "arctic"
syntax = "InspiredGitHub"

[ui]
toc_bg = "#e6e9ef"
toc_border = "#8c8fa1"
content_bg = "#eff1f5"
scrollbar_hover = "#df8e1d"
status_bg = "#e6e9ef"
status_separator = "#8c8fa1"
status_brand_fg = "#eff1f5"
status_brand_bg = "#1e66f5"
status_filename_fg = "#5c5f77"
status_filename_bg = "#ccd0da"
status_watch_fg = "#40a02b"
status_watch_bg = "#d5e8cf"
status_reloaded_fg = "#eff1f5"
status_reloaded_bg = "#40a02b"
status_search_fg = "#df8e1d"
status_search_bg = "#ccd0da"
status_success_fg = "#40a02b"
status_success_bg = "#d5e8cf"
status_warning_fg = "#df8e1d"
status_error_fg = "#d20f39"
status_error_bg = "#f2d5d9"
status_shortcut_fg = "#8c8fa1"
status_percent_fg = "#df8e1d"
toc_hover_fg = "#4c4f69"
toc_header_fg = "#8c8fa1"
toc_active_bg = "#ccd0da"
toc_inactive_bg = "#e6e9ef"
toc_accent = "#1e66f5"
toc_index_inactive = "#8c8fa1"
toc_primary_active = "#4c4f69"
toc_primary_inactive = "#5c5f77"
toc_secondary_inactive = "#8c8fa1"
toc_secondary_text_active = "#5c5f77"
toc_secondary_text_inactive = "#7c7f93"

[markdown]
search_highlight_bg = "#ccd0da"
search_match_bg = "#df8e1d"
code_gutter = "#8c8fa1"
blockquote_marker = "#179299"
list_level_1 = "#40a02b"
list_level_2 = "#1e66f5"
list_level_3 = "#8839ef"
ordered_list = "#df8e1d"
table_border = "#8c8fa1"
table_separator = "#bcc0cc"
table_header = "#df8e1d"
table_cell = "#5c5f77"
heading_1 = "#1e66f5"
heading_2 = "#40a02b"
heading_3 = "#df8e1d"
heading_4 = "#8839ef"
heading_other = "#179299"
heading_underline = "#8c8fa1"
code_frame = "#8c8fa1"
code_label = "#179299"
inline_code_fg = "#df8e1d"
inline_code_bg = "#ccd0da"
rule = "#8c8fa1"
link_icon = "#1e66f5"
link_text = "#1e66f5"
link_hover = "#179299"
blockquote_text = "#5c5f77"
text = "#5c5f77"
strong_text = "#4c4f69"
latex_inline_fg = "#8839ef"
latex_inline_bg = "#ccd0da"
latex_block_fg = "#8839ef"
mermaid_keyword = "#179299"
mermaid_arrow = "#1e66f5"
mermaid_label = "#40a02b"
mermaid_block_fg = "#5c5f77"
mark_fg = "#eff1f5"
mark_bg = "#df8e1d"
task_checked = "#40a02b"
task_unchecked = "#8c8fa1"
alert_note = "#1e66f5"
alert_tip = "#40a02b"
alert_important = "#8839ef"
alert_warning = "#df8e1d"
alert_caution = "#d20f39"

# leaf theme aligned to ghostty's default palette (Tomorrow Night).
# Palette source: `ghostty +show-config --default`
#   bg #282c34  fg #ffffff  |  0 #1d1f21  8 #666666
#   red #cc6666  green #b5bd68  yellow #f0c674
#   blue #81a2be  magenta #b294bb  cyan #8abeb7  white #c5c8c6/#eaeaea
base = "ocean"
syntax = "base16-eighties.dark"

[ui]
toc_bg = "#1d1f21"
toc_border = "#666666"
content_bg = "#282c34"
scrollbar_hover = "#f0c674"
status_bg = "#1d1f21"
status_separator = "#666666"
status_brand_fg = "#282c34"
status_brand_bg = "#81a2be"
status_filename_fg = "#c5c8c6"
status_filename_bg = "#3a3f4b"
status_watch_fg = "#b5bd68"
status_watch_bg = "#2b3320"
status_reloaded_fg = "#282c34"
status_reloaded_bg = "#b5bd68"
status_search_fg = "#f0c674"
status_search_bg = "#3a3f4b"
status_success_fg = "#b5bd68"
status_success_bg = "#2b3320"
status_warning_fg = "#f0c674"
status_error_fg = "#cc6666"
status_error_bg = "#3a2323"
status_shortcut_fg = "#666666"
status_percent_fg = "#f0c674"
toc_hover_fg = "#eaeaea"
toc_header_fg = "#666666"
toc_active_bg = "#3a3f4b"
toc_inactive_bg = "#1d1f21"
toc_accent = "#81a2be"
toc_index_inactive = "#666666"
toc_primary_active = "#eaeaea"
toc_primary_inactive = "#c5c8c6"
toc_secondary_inactive = "#666666"
toc_secondary_text_active = "#c5c8c6"
toc_secondary_text_inactive = "#8a8a8a"

[markdown]
search_highlight_bg = "#3a3f4b"
search_match_bg = "#f0c674"
code_gutter = "#666666"
blockquote_marker = "#8abeb7"
list_level_1 = "#b5bd68"
list_level_2 = "#81a2be"
list_level_3 = "#b294bb"
ordered_list = "#f0c674"
table_border = "#666666"
table_separator = "#4a4a4a"
table_header = "#f0c674"
table_cell = "#c5c8c6"
heading_1 = "#81a2be"
heading_2 = "#b5bd68"
heading_3 = "#f0c674"
heading_4 = "#b294bb"
heading_other = "#8abeb7"
heading_underline = "#666666"
code_frame = "#666666"
code_label = "#8abeb7"
inline_code_fg = "#f0c674"
inline_code_bg = "#3a3f4b"
rule = "#666666"
link_icon = "#81a2be"
link_text = "#81a2be"
link_hover = "#8abeb7"
blockquote_text = "#c5c8c6"
text = "#c5c8c6"
strong_text = "#eaeaea"
latex_inline_fg = "#b294bb"
latex_inline_bg = "#3a3f4b"
latex_block_fg = "#b294bb"
mermaid_keyword = "#8abeb7"
mermaid_arrow = "#81a2be"
mermaid_label = "#b5bd68"
mermaid_block_fg = "#c5c8c6"
mark_fg = "#282c34"
mark_bg = "#f0c674"
task_checked = "#b5bd68"
task_unchecked = "#666666"
alert_note = "#81a2be"
alert_tip = "#b5bd68"
alert_important = "#b294bb"
alert_warning = "#f0c674"
alert_caution = "#cc6666"

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# node --version takes >1s here (binary scanning); default 500ms times out
command_timeout = 2000

[gcloud]
disabled = true

[jobs]
symbol = "✦"
style = "yellow bold"
number_threshold = 1
symbol_threshold = 1
